name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a project with the brief "..."
        2. ...
  - type: input
    id: provider
    attributes:
      label: Provider / model
      placeholder: Claude Code, OpenAI gpt-5-mini, Ollama qwen3:14b, demo mode...
  - type: input
    id: env
    attributes:
      label: OS and Node.js version
      placeholder: Windows 11, Node 22.3
  - type: textarea
    id: logs
    attributes:
      label: Server console output
      description: Remove API keys and other secrets before pasting.
      render: text
